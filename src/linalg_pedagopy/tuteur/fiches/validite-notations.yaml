id: validite-notations
numero: 2
titre: 'Notations vectorielles : valides ou non ?'
theme: Vecteurs et produit scalaire
niveau: 1
type: dimensions
enonce: Soient $a$ et $b$ deux vecteurs de $\mathbb{R}^n$ ($n > 1$) et $\alpha$ un scalaire. Indiquer
  pour chacune des notations (a) $a + b$, (b) $a + \alpha$, (c) $a^T b$, (d) $a b$ si elle est valide
  ou invalide.
notions:
- notations vectorielles
- dimensions
donnees:
  n: 4
verification:
  type: dimensions
  attendu:
    a: valide
    b: invalide
    c: valide
    d: invalide
indices:
- Distinguez dans chaque expression ce qui est un vecteur de $\mathbb{R}^n$ (matrice $n \times 1$) et
  ce qui est un scalaire.
- L'addition n'est définie qu'entre deux vecteurs de même taille, et le produit de
  deux vecteurs s'écrit $a^T b$.
- Peut-on additionner directement un vecteur et un scalaire sans utiliser le vecteur $\mathbf{1}$ ? Peut-on
  multiplier deux colonnes $n \times 1$ sans transposer la première ?
jumeau: generateurs.dimensions_expressions()
