id: '5.2'
page: 14
type: contre_exemple
reformulation: L'algorithme de Gram-Schmidt dépend-il de l'ordre des vecteurs d'entrée
  ? Donner deux vecteurs indépendants $(a_1, a_2)$ de $\mathbb{R}^2$ tels que Gram-Schmidt
  appliqué à $(a_1, a_2)$ puis à $(a_2, a_1)$ produise deux bases orthonormées différentes.
donnees:
  n: 2
verification:
  type: contre_exemple
  cas: ordre_gram_schmidt_5_2
indices:
- Le premier vecteur produit par Gram-Schmidt est toujours $q_1 = \frac{a_1}{\|a_1\|}$
  (VMLS ch. 5).
- Si l'on inverse l'ordre en $(a_2, a_1)$, le nouveau premier vecteur est $p_1 = \frac{a_2}{\|a_2\|}$.
- Pour que les deux bases orthonormées diffèrent, choisissez dans $\mathbb{R}^2$ deux
  vecteurs indépendants qui ne sont pas déjà orthogonaux entre eux.
jumeau: generateurs.contre_exemple_guide(famille='R^2, coefficients dans {0, 1}')
notions:
- algorithme de Gram-Schmidt
- influence de l'ordre des vecteurs
- VMLS ch. 5
source: Boyd & Vandenberghe, Additional Exercises for VMLS, §5.2, p. 14
ecart: Aucun (construction d'un contre-exemple (a_1, a_2) montrant la dépendance à
  l'ordre de Gram-Schmidt, VMLS §5.2).
