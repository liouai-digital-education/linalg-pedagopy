id: '20.8'
page: 48
type: justification
reformulation: 'Vérifier par une chaîne d''égalités matricielles par blocs l''identité
  : $\begin{bmatrix} A & B \\ C & D \end{bmatrix} \begin{bmatrix} I & 0 \\ 0 & I \end{bmatrix}
  = \begin{bmatrix} A & B \\ C & D \end{bmatrix}$ (soumettre la liste des maillons
  simplifiés).'
donnees:
  n: 2
verification:
  type: egalites
  mode: blocs
indices:
- Le produit de deux matrices par blocs compatibles se calcule comme un produit matriciel
  usuel en remplaçant les produits scalaires par des produits de blocs (VMLS ch. 10
  et 20).
- 'Rappel : la matrice par blocs $\begin{bmatrix} I & 0 \\ 0 & I \end{bmatrix}$ est
  la matrice identité de la dimension totale.'
- Écrivez le premier maillon avec l'opérateur @ entre les deux matrices par blocs,
  puis le bloc résultant simplifié.
jumeau: generateurs.dimensions_expressions()
notions:
- identités sur les matrices par blocs
- produit matriciel par blocs
- VMLS ch. 10 et 20
source: Boyd & Vandenberghe, Additional Exercises for VMLS, §20.8, p. 48
ecart: Vérification par blocs de l'identité multiplicative sur [[A, B], [C, D]] (VMLS
