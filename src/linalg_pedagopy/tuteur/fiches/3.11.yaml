id: "3.11"
page: 8
type: dimensions
reformulation: >
  Pour un vecteur colonne x de R^n (n > 1), la notation x^2 (au sens du produit x x)
  est-elle valide ou invalide ? Comment s'écrit correctement le carré de la norme ||x||^2
  en notation matricielle/vectorielle ?
donnees:
  n: 3
verification:
  type: dimensions
  attendu: "invalide"
indices:
  - "Un vecteur x de R^n est assimilé à une matrice colonne de taille n×1."
  - "Pour que le produit de deux matrices de tailles (m×k) et (p×q) soit défini, il faut que k = p."
  - "Peut-on multiplier une matrice (n×1) par une matrice (n×1) lorsque n > 1 ? Pourquoi écrit-on x^T x et non x^2 ?"
jumeau: "generateurs.dimensions_expressions()"
notions:
  - "validité des notations vectorielles"
  - "produit scalaire x^T x"
  - "VMLS ch. 3"
