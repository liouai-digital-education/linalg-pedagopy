id: vecteur-repete
numero: 17
titre: Répéter un vecteur
theme: Matrices et applications linéaires
niveau: 1
type: modelisation
enonce: Pour un vecteur $x \in \mathbb{R}^2$, on forme le vecteur $y = (x, x, x) \in \mathbb{R}^6$ obtenu
  en répétant trois fois le vecteur $x$. Donner la matrice $A$ de taille $6 \times 2$ telle que $y = A
  x$.
notions:
- matrices par blocs
- répétition d'un vecteur
donnees:
  n: 2
  m: 6
verification:
  type: matrice
  inconnue: x
  nom_sortie: y
  taille_entree: 2
  taille_sortie: 6
  lignes_cibles:
  - y[1] = x[1]
  - y[2] = x[2]
  - y[3] = x[1]
  - y[4] = x[2]
  - y[5] = x[1]
  - y[6] = x[2]
indices:
- 'Le vecteur d''entrée $x$ est dans $\mathbb{R}^2$ et le vecteur de sortie $y = (x, x, x)$ est dans $\mathbb{R}^6$
  : quelle est la taille de $A$ ?'
- Quelle matrice $2 \times 2$ multiplie $x$ pour redonner exactement $x$ ?
- Empilez verticalement trois blocs identité $I_2$ pour obtenir les 6 lignes de $A$.
jumeau: generateurs.matrice_par_effet()
