id: '10.10'
page: 23
type: modelisation
reformulation: Pour une matrice $A$ de taille $2 \times 3$ dont la liste des colonnes
  mises bout à bout est vue ou résumée par les sommes de chaque ligne $s = A \mathbf{1}_3$,
  donner la matrice $B$ de taille $1 \times 3$ telle que pour tout vecteur $v \in
  \mathbb{R}^3$, le produit $B v$ calcule la somme $v_1 + v_2 + v_3$.
donnees:
  n: 3
  m: 1
verification:
  type: matrice
  inconnue: v
  nom_sortie: s
  taille_entree: 3
  taille_sortie: 1
  lignes_cibles:
  - s[1] = v[1] + v[2] + v[3]
indices:
- Pour sommer toutes les composantes d'un vecteur colonne $v \in \mathbb{R}^3$ par
  un produit matriciel $B v$, quelle doit être la taille de $B$ ?
- 'Rappel (VMLS ch. 10) : la somme des coefficients d''une matrice $A$ ($m \times
  n$) s''écrit $\mathbf{1}_m^T A \mathbf{1}_n$.'
- Écrivez le vecteur ligne $\mathbf{1}_3^T$ comme une matrice de taille $1 \times
  3$.
jumeau: generateurs.moyenne_glissante(fenetre=2, n=5)
notions:
- somme des coefficients d'une matrice
- multiplication par le vecteur 1
- VMLS ch. 10
source: Boyd & Vandenberghe, Additional Exercises for VMLS, §10.10, p. 23
ecart: Calcul de la matrice de Gram G = A^T A pour tester l'orthonormalité des colonnes
  (VMLS §10.10).
