id: statistiques-vecteur
numero: 8
titre: Moyenne, rms et écart type d'un vecteur
theme: Normes, distances et angles
niveau: 2
type: calcul
enonce: 'On considère les vecteurs $x = (1, -2, 3, 2)$ et $y = (2, 1, 0, 1)$ de $\mathbb{R}^4$. Calculer
  $\text{rms}(x)$ (ou fournir un dictionnaire {''rms'': ..., ''avg'': ..., ''std'': ..., ''corr'': ...,
  ''dist'': ...}).'
notions:
- rms, avg, std, corrélation, distance
donnees:
  x:
  - 1
  - -2
  - 3
  - 2
  y:
  - 2
  - 1
  - 0
  - 1
verification:
  type: valeur
  calcul_principal: x.rms()
  calcul:
    rms: x.rms()
    avg: x.avg()
    std: x.std()
    dist: x.distance(y)
    corr: x.correlation(y)
indices:
- 'Cet exercice porte sur les grandeurs statistiques de : $\text{avg}(x)$, $\text{rms}(x)$, $\text{std}(x)$,
  corrélation et distance.'
- 'Rappel : $\text{rms}(x) = \frac{\|x\|}{\sqrt{n}}$, et $\text{std}(x) = \text{rms}(x - \text{avg}(x)\mathbf{1})$
  (attention au dénominateur $\sqrt{n}$).'
- Pour $x = (1, -2, 3, 2)$ de dimension $n = 4$, calculez d'abord la somme des carrés des composantes,
  puis divisez par $n$ avant de prendre la racine carrée.
jumeau: generateurs.statistiques_vecteur(values=(2, -1, 5, 2))
