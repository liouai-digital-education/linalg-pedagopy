id: '2.1'
page: 5
type: modelisation
reformulation: 'Soit $f : \mathbb{R}^4 \to \mathbb{R}$ la fonction linéaire qui associe
  à $x$ l''écart entre sa valeur centrale $\frac{x_2 + x_3}{2}$ et la moyenne de ses
  valeurs extrêmes $\frac{x_1 + x_4}{2}$. Trouver le vecteur $a \in \mathbb{R}^4$
  tel que $f(x) = a^T x$.'
donnees:
  n: 4
verification:
  type: produit_scalaire
  inconnue: x
  taille: 4
  cible: (x[2] + x[3])/2 - (x[1] + x[4])/2
indices:
- Toute fonction linéaire de $\mathbb{R}^4$ dans $\mathbb{R}$ s'écrit de manière unique
  sous la forme $f(x) = a^T x$ avec $a \in \mathbb{R}^4$ (VMLS ch. 2).
- La $i$-ième composante de $a$ est $a_i = f(e_i)$, c'est-à-dire le coefficient devant
  $x_i$.
- Développez $\frac{x_2 + x_3}{2} - \frac{x_1 + x_4}{2}$ et lisez le coefficient devant
  chacune des 4 composantes.
jumeau: generateurs.produit_scalaire_selection(n=4, indices=(2, 3))
notions:
- fonction linéaire
- représentation par produit scalaire
- VMLS ch. 2
source: Boyd & Vandenberghe, Additional Exercises for VMLS, §2.1, p. 5
ecart: Sous-question (a) de VMLS §2.1 modélisée sous la forme f(x) = a^T x sur R^4.
