id: '20.2'
page: 47
type: calcul
reformulation: 'On considère les vecteurs $x = (1, 0, -1)$ et $y = (0, 1, 1)$ de $\mathbb{R}^3$.
  Calculer leur distance euclidienne $\|x - y\|$ (ou un dictionnaire {''dist'': ...,
  ''angle'': ...}).'
donnees:
  x:
  - 1
  - 0
  - -1
  y:
  - 0
  - 1
  - 1
verification:
  type: valeur
  calcul: x.distance(y)
indices:
- 'Rappel (VMLS ch. 3 et 20) : $\text{dist}(x, y) = \|x - y\|$ et $\cos(\theta) =
  \frac{x^T y}{\|x\| \|y\|}$.'
- Calculez d'abord le vecteur différence $x - y$ composante par composante.
- Élevez chaque composante de $x - y$ au carré, additionnez-les, puis prenez la racine
  carrée.
jumeau: generateurs.statistiques_vecteur(values=(2, -1, 5, 2))
notions:
- angle et distance entre vecteurs
- VMLS ch. 3 et 20
source: Boyd & Vandenberghe, Additional Exercises for VMLS, ?20.2, p. 47
ecart: Calcul exact de distance d'un vecteur ? sa projection (VMLS ?20.2).
