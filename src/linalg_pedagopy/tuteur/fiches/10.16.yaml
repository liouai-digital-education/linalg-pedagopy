id: "10.16"
page: 24
type: modelisation
reformulation: >
  Soit A une matrice m×n, D = diag(d_1, ..., d_m) une matrice diagonale m×m et
  E = diag(e_1, ..., e_n) une matrice diagonale n×n. Exprimer le coefficient (i, j)
  du produit D A E en fonction de d_i, a_ij (représentant A_(i,j)) et e_j.
donnees:
  m: 3
  n: 3
verification:
  type: formule
  parametres:
    - d_i
    - a_ij
    - e_j
  cible: "d_i * a_ij * e_j"
indices:
  - "Analysez l'effet de la multiplication à gauche par une matrice diagonale D, puis à droite par une matrice diagonale E (VMLS ch. 10)."
  - "Rappel : multiplier A à gauche par D = diag(d_1, ..., d_m) multiplie la ligne i de A par d_i."
  - "Multiplier ensuite à droite par E = diag(e_1, ..., e_n) multiplie la colonne j par e_j. Quel est alors le coefficient (i, j) ?"
jumeau: "generateurs.combinaison_orthogonale(c1=2, c2=3)"
notions:
  - "multiplication par des matrices diagonales D A E"
  - "mise à l'échelle des lignes et colonnes"
  - "VMLS ch. 10"
