id: dynamique-trois-pas
numero: 26
titre: 'Dynamique linéaire : trois pas de temps'
theme: Produit matriciel
niveau: 2
type: modelisation
enonce: Un système dynamique linéaire évolue selon $x_{t+1} = A x_t$ avec $A = \begin{bmatrix} 1 & 1 \\
  0 & 1 \end{bmatrix}$. Exprimer l'état à l'instant $t + 3$ sous la forme $x_{t+3} = M x_t$ en donnant
  la matrice $M = A^3$ de taille $2 \times 2$.
notions:
- puissances d'une matrice
- évolution à t + 3
donnees:
  n: 2
  m: 2
verification:
  type: matrice
  inconnue: x
  nom_sortie: y
  taille_entree: 2
  taille_sortie: 2
  lignes_cibles:
  - y[1] = x[1] + 3*x[2]
  - y[2] = x[2]
indices:
- Si $x_{t+1} = A x_t$, alors $x_{t+2} = A^2 x_t$ et $x_{t+3} = A^3 x_t$.
- 'Rappel : la puissance de matrice $A^3$ se calcule par produits matriciels successifs $A \cdot (A \cdot
  A)$.'
- Calculez d'abord $A^2$ pour $A = \begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix}$, puis multipliez le résultat
  par $A$.
jumeau: generateurs.puissance_matrice()
