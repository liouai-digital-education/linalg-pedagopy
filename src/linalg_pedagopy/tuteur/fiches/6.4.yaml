id: "6.4"
page: 15
type: modelisation
reformulation: >
  p ∈ R^6 est une série de prix. d ∈ R^3 mesure, à partir du 4e jour, l'écart
  entre le prix du jour et la moyenne des trois jours précédents.
  Trouver la matrice A telle que d = A p (donner sa taille et ses coefficients).
donnees:
  n: 6
  m: 3
verification:
  type: matrice
  inconnue: p
  nom_sortie: d
  taille_entree: 6
  taille_sortie: 3
  cible: "d[i] = p[i+3] - (p[i] + p[i+1] + p[i+2]) / 3"
indices:
  - "Quelle est la taille de d ? celle de p ? Qu'en déduisez-vous pour A ?"
  - "La ligne i de A contient les coefficients de d_i exprimé en fonction de p_1, ..., p_6."
  - "Écrivez d_1 en fonction des p_j, puis lisez ses coefficients."
jumeau: "generateurs.moyenne_glissante(fenetre=2, n=5)"
notions:
  - "matrice comme application linéaire"
  - "VMLS ch. 6"
