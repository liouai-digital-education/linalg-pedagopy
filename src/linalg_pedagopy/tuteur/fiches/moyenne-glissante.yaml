id: moyenne-glissante
numero: 16
titre: Écart à la moyenne glissante
theme: Matrices et applications linéaires
niveau: 2
type: modelisation
enonce: $p \in \mathbb{R}^6$ est une série de prix. $d \in \mathbb{R}^3$ mesure, à partir du 4ᵉ jour,
  l'écart entre le prix du jour et la moyenne des trois jours précédents. Trouver la matrice $A$ telle
  que $d = A p$ (donner sa taille et ses coefficients).
notions:
- matrice comme application linéaire
donnees:
  n: 6
  m: 3
verification:
  type: matrice
  inconnue: p
  nom_sortie: d
  taille_entree: 6
  taille_sortie: 3
  cible: d[i] = p[i+3] - (p[i] + p[i+1] + p[i+2]) / 3
indices:
- Quelle est la taille de $d$ ? celle de $p$ ? Qu'en déduisez-vous pour $A$ ?
- La ligne $i$ de $A$ contient les coefficients de $d_i$ exprimé en fonction de $p_1, \dots, p_6$.
- Écrivez $d_1$ en fonction des $p_j$, puis lisez ses coefficients.
jumeau: generateurs.moyenne_glissante(fenetre=2, n=5)
