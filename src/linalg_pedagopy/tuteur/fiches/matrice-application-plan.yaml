id: matrice-application-plan
numero: 19
titre: Matrice d'une application du plan
theme: Matrices et applications linéaires
niveau: 1
type: modelisation
enonce: 'Soit l''application linéaire $f : \mathbb{R}^2 \to \mathbb{R}^2$ qui à $x = (x_1, x_2)$ associe
  $y = (y_1, y_2)$ avec $y_1 = 2 x_2 - x_1$ et $y_2 = x_1 + 3 x_2$. Donner la matrice $A$ ($2 \times 2$)
  telle que $y = A x$.'
notions:
- applications linéaires de R^2 dans R^2
- représentation matricielle
donnees:
  n: 2
  m: 2
verification:
  type: matrice
  inconnue: x
  nom_sortie: y
  taille_entree: 2
  taille_sortie: 2
  lignes_cibles:
  - y[1] = -x[1] + 2*x[2]
  - y[2] = x[1] + 3*x[2]
indices:
- Une application linéaire de $\mathbb{R}^2$ dans $\mathbb{R}^2$ est représentée par une matrice $A$ de
  taille $2 \times 2$.
- La première colonne de $A$ est l'image de $e_1 = (1, 0)$, et la deuxième colonne est l'image de $e_2
  = (0, 1)$.
- 'Attention à l''ordre des termes dans $y_1 = 2 x_2 - x_1$ : placez d''abord le coefficient de $x_1$,
  puis celui de $x_2$.'
jumeau: generateurs.matrice_par_effet()
