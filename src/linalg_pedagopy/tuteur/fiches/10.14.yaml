id: "10.14"
page: 24
type: modelisation
reformulation: >
  Un système dynamique linéaire évolue selon x_(t+1) = A x_t avec A = [[1, 1], [0, 1]].
  Exprimer l'état à l'instant t + 3 sous la forme x_(t+3) = M x_t en donnant la
  matrice M = A^3 de taille 2×2.
donnees:
  n: 2
  m: 2
verification:
  type: matrice
  inconnue: x
  nom_sortie: y
  taille_entree: 2
  taille_sortie: 2
  lignes_cibles:
    - "y[1] = x[1] + 3*x[2]"
    - "y[2] = x[2]"
indices:
  - "Si x_(t+1) = A x_t, alors x_(t+2) = A^2 x_t et x_(t+3) = A^3 x_t (VMLS ch. 9 et 10)."
  - "Rappel : la puissance de matrice A^3 se calcule par produits matriciels successifs A · (A · A)."
  - "Calculez d'abord A^2 pour A = [[1, 1], [0, 1]], puis multipliez le résultat par A."
jumeau: "generateurs.moyenne_glissante(fenetre=2, n=5)"
notions:
  - "puissances d'une matrice"
  - "évolution à t + 3"
  - "VMLS ch. 10"
