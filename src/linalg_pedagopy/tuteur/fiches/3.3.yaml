id: "3.3"
page: 6
type: vrai_faux
reformulation: >
  Soient a, b, c trois vecteurs de R^n tels que a ⊥ c et b ⊥ c. Pour chacune des
  affirmations (a) a ⊥ b, (b) (a + b) ⊥ c, (c) (a - b) ⊥ (a + b), prédire si elle
  est « toujours vrai » ou « peut être faux », puis tester au laboratoire.
donnees:
  n: 3
verification:
  type: labo
  hypotheses:
    - "a.dot(c) == 0"
    - "b.dot(c) == 0"
  hypotheses_texte: "a ⊥ c et b ⊥ c"
  affirmations:
    a: "a.dot(b) == 0"
    b: "(a + b).dot(c) == 0"
    c: "(a - b).dot(a + b) == 0"
indices:
  - "Traduisez chaque relation d'orthogonalité u ⊥ v par la nullité du produit scalaire u^T v = 0 (VMLS ch. 3)."
  - "Rappel : le produit scalaire est distributif par rapport à l'addition : (u + v)^T w = u^T w + v^T w."
  - "Dans R^3, si c = (0, 0, 1), quels sont les vecteurs orthogonaux à c ? Deux tels vecteurs sont-ils nécessairement orthogonaux entre eux ou de même norme ?"
jumeau: "generateurs.contre_exemple_guide(famille='R^3, coefficients dans {0, 1}')"
notions:
  - "orthogonalité"
  - "distributivité du produit scalaire"
  - "VMLS ch. 3"
