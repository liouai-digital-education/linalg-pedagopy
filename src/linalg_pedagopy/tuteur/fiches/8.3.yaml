id: '8.3'
page: 19
type: modelisation
reformulation: 'Soit l''application linéaire $f : \mathbb{R}^2 \to \mathbb{R}^2$ qui
  à $x = (x_1, x_2)$ associe la réflexion par rapport à la première bissectrice suivie
  d''un décalage linéaire : $y_1 = 2 x_2 - x_1$, $y_2 = x_1 + 3 x_2$. Donner la matrice
  $A$ ($2 \times 2$) telle que $y = A x$.'
donnees:
  n: 2
  m: 2
verification:
  type: matrice
  inconnue: x
  nom_sortie: y
  taille_entree: 2
  taille_sortie: 2
  lignes_cibles:
  - y[1] = -x[1] + 2*x[2]
  - y[2] = x[1] + 3*x[2]
indices:
- Une application linéaire de $\mathbb{R}^2$ dans $\mathbb{R}^2$ est représentée par
  une matrice $A$ de taille $2 \times 2$ (VMLS ch. 8).
- La première colonne de $A$ est l'image de $e_1 = (1, 0)$, et la deuxième colonne
  est l'image de $e_2 = (0, 1)$.
- 'Attention à l''ordre des termes dans $y_1 = 2 x_2 - x_1$ : placez d''abord le coefficient
  de $x_1$, puis celui de $x_2$.'
jumeau: generateurs.moyenne_glissante(fenetre=2, n=5)
notions:
- applications linéaires de R^2 dans R^2
- représentation matricielle
- VMLS ch. 8
source: Boyd & Vandenberghe, Additional Exercises for VMLS, §8.3, p. 19
ecart: Évaluation d'une composition d'applications linéaires par produit matriciel
  A B x (VMLS §8.3).
