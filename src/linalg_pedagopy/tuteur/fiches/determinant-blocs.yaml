id: determinant-blocs
numero: 37
titre: Déterminant d'une matrice triangulaire par blocs
theme: Déterminants
niveau: 2
type: calcul
enonce: >-
  Calculer le déterminant de la matrice
  $M = \begin{bmatrix} 2 & 1 & 4 & -1 \\ 1 & 3 & 0 & 2 \\ 0 & 0 & 1 & 2 \\ 0 & 0 & -1 & 4 \end{bmatrix}$
  sans développer complètement, en exploitant sa structure par blocs.
notions:
- matrice triangulaire par blocs
- déterminant d'un produit de blocs
donnees:
  M:
  - [2, 1, 4, -1]
  - [1, 3, 0, 2]
  - [0, 0, 1, 2]
  - [0, 0, -1, 4]
verification:
  type: valeur
  calcul: M.det()
  erreurs:
  - valeur: (M[0,0]*M[1,1] - M[0,1]*M[1,0]) + (M[2,2]*M[3,3] - M[2,3]*M[3,2])
    diagnostic: >-
      Vous avez additionné les déterminants des blocs diagonaux. Pour une matrice triangulaire
      par blocs, ces déterminants se combinent autrement : par quelle opération ?
  - valeur: M[0,0]*M[1,1]*M[2,2]*M[3,3]
    diagnostic: >-
      Votre valeur est le produit des coefficients diagonaux de $M$. Ce raccourci vaut pour une
      matrice triangulaire, mais ici les blocs diagonaux ne sont pas eux-mêmes triangulaires.
indices:
- >-
  Découpez $M$ en quatre blocs $2 \times 2$. Que remarquez-vous sur le bloc situé en bas à
  gauche ?
- >-
  Rappel : si $M = \begin{bmatrix} A & B \\ 0 & D \end{bmatrix}$ avec $A$ et $D$ carrées,
  alors $\det M = \det A \cdot \det D$ ; le bloc $B$ n'intervient pas.
- >-
  Calculez séparément le déterminant du bloc $A$ (lignes et colonnes 1 et 2) et celui du bloc
  $D$ (lignes et colonnes 3 et 4) : ce sont deux déterminants $2 \times 2$.
jumeau: generateurs.determinant_blocs()
