id: etendue-non-lineaire
numero: 5
titre: L'étendue n'est pas linéaire
theme: Vecteurs et produit scalaire
niveau: 2
type: contre_exemple
enonce: 'On considère la fonction $f : \mathbb{R}^n \to \mathbb{R}$ définie par l''étendue (*spread*)
  $f(x) = \max_k x_k - \min_k x_k$. Montrer que $f$ n''est pas linéaire en fournissant un contre-exemple
  explicite {''x'': Vector(...), ''y'': Vector(...), ''alpha'': 1, ''beta'': 1}.'
notions:
- superposition et linéarité
- contre-exemple
donnees:
  n: 2
verification:
  type: contre_exemple
  cas: non_linearite_etendue
indices:
- Pour prouver qu'une fonction $f$ n'est pas linéaire, il suffit d'exhiber deux vecteurs $x, y$ et deux
  scalaires $\alpha, \beta$ tels que $f(\alpha x + \beta y) \neq \alpha f(x) + \beta f(y)$.
- 'Rappel : vous pouvez choisir $n = 2$ et $\alpha = \beta = 1$, c''est-à-dire chercher $x$ et $y$ dans
  $\mathbb{R}^2$ tels que $f(x + y) \neq f(x) + f(y)$.'
- Choisissez dans $\mathbb{R}^2$ deux vecteurs dont les composantes maximales n'apparaissent pas au même
  indice, puis comparez $f(x + y)$ et $f(x) + f(y)$.
jumeau: generateurs.contre_exemple_guide(famille='R^2, coefficients dans {0, 1}')
