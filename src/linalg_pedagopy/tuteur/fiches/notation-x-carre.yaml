id: notation-x-carre
numero: 9
titre: Que signifie x² pour un vecteur ?
theme: Normes, distances et angles
niveau: 1
type: dimensions
enonce: Pour un vecteur colonne $x \in \mathbb{R}^n$ ($n > 1$), la notation $x^2$ (au sens du produit
  $x x$) est-elle valide ou invalide ? Comment s'écrit correctement le carré de la norme $\|x\|^2$ en
  notation matricielle/vectorielle ?
notions:
- validité des notations vectorielles
- produit scalaire x^T x
donnees:
  n: 3
verification:
  type: dimensions
  attendu: invalide
indices:
- Un vecteur $x \in \mathbb{R}^n$ est assimilé à une matrice colonne de taille $n \times 1$.
- Pour que le produit de deux matrices de tailles $(m \times k)$ et $(p \times q)$ soit défini, il faut
  que $k = p$.
- Peut-on multiplier une matrice $(n \times 1)$ par une matrice $(n \times 1)$ lorsque $n > 1$ ? Pourquoi
  écrit-on $x^T x$ et non $x^2$ ?
