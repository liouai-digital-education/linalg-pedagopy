id: '3.2'
page: 6
type: calcul
reformulation: On donne $x = (1, 2, -1)$ et $y = (2, 0, 1)$ dans $\mathbb{R}^3$. Calculer
  la distance euclidienne $\|x - y\|$ entre $x$ et $y$.
donnees:
  x:
  - 1
  - 2
  - -1
  y:
  - 2
  - 0
  - 1
verification:
  type: valeur
  calcul: x.distance(y)
indices:
- 'La distance entre deux vecteurs $x$ et $y$ de $\mathbb{R}^3$ est la norme de leur
  différence : $\text{dist}(x, y) = \|x - y\|$ (VMLS ch. 3).'
- 'Rappel : $\|u\| = \sqrt{u_1^2 + u_2^2 + u_3^2}$. N''oubliez pas la racine carrée
  finale !'
- Calculez d'abord le vecteur différence $x - y$ composante par composante, puis la
  somme des carrés de ses composantes.
jumeau: generateurs.statistiques_vecteur(values=(2, -1, 5, 2))
notions:
- distance euclidienne
- plus proche voisin
- VMLS ch. 3
source: Boyd & Vandenberghe, Additional Exercises for VMLS, ?3.2, p. 6
ecart: Instance num?rique exacte dans R^3 illustrant le calcul de distance euclidienne
  de VMLS ?3.2.
