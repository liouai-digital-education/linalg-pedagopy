id: reseau-amitie
numero: 25
titre: Un réseau d'amitié
theme: Produit matriciel
niveau: 2
type: modelisation
enonce: 'On considère un réseau d''amitié entre 4 personnes : 1 est amie avec 2 et 3 ; 2 est amie avec
  1, 3 et 4 ; 3 est amie avec 1, 2 et 4 ; 4 est amie avec 2 et 3. Pour un vecteur de caractéristiques
  $x \in \mathbb{R}^4$, le vecteur $y$ donne pour chaque personne la somme des caractéristiques de ses
  amis. Donner la matrice $F$ ($4 \times 4$) telle que $y = F x$.'
notions:
- matrice d'adjacence d'un graphe
- produit matrice-vecteur
donnees:
  n: 4
  m: 4
verification:
  type: matrice
  inconnue: x
  nom_sortie: y
  taille_entree: 4
  taille_sortie: 4
  lignes_cibles:
  - y[1] = x[2] + x[3]
  - y[2] = x[1] + x[3] + x[4]
  - y[3] = x[1] + x[2] + x[4]
  - y[4] = x[2] + x[3]
indices:
- Dans une matrice d'amitié $F$ de taille $4 \times 4$, $F_{ij} = 1$ si $i$ et $j$ sont amis et $0$ sinon
  (avec $F_{ii} = 0$).
- La $i$-ième composante de $y = F x$ est la somme des $x_j$ sur tous les amis $j$ de la personne $i$.
- Vérifiez ligne par ligne quels individus sont reliés dans la définition de $y_1, y_2, y_3$ et $y_4$.
jumeau: generateurs.matrice_adjacence()
