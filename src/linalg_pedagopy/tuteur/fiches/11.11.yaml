id: '11.11'
page: 27
type: calcul
reformulation: On considère la matrice large $A = \begin{bmatrix} 1 & -1 & 2 \\ 0
  & 1 & 1 \end{bmatrix}$ de taille $2 \times 3$. Trouver deux matrices inverses à
  droite distinctes $B_1$ et $B_2$ (de taille $3 \times 2$) telles que $A B_1 = I_2$,
  $A B_2 = I_2$ et $B_1 \neq B_2$, et les soumettre sous la forme $(B_1, B_2)$.
donnees:
  A:
  - - 1
    - -1
    - 2
  - - 0
    - 1
    - 1
verification:
  type: propriete
  propriete: two_right_inverses
indices:
- Une inverse à droite $B$ de $A$ ($2 \times 3$) est une matrice $3 \times 2$ dont
  les colonnes $b_1, b_2$ vérifient $A b_1 = e_1$ et $A b_2 = e_2$ (VMLS ch. 11).
- Comme $A$ a 2 lignes indépendantes et 3 colonnes, chaque système $A b = e_j$ possède
  une variable libre (la 3\textsuperscript{e} composante).
- Choisissez deux affectations différentes pour les variables libres de la 3\textsuperscript{e}
  ligne de $B$, puis déduisez les deux premières lignes pour obtenir $B_1$ et $B_2$
  distinctes.
jumeau: generateurs.inverse_droite_exemple()
notions:
- inverses à droite multiples
- systèmes sous-déterminés
- VMLS ch. 11
source: Boyd & Vandenberghe, Additional Exercises for VMLS, ?11.11, p. 27
ecart: Aucun (construction de deux inverses ? droite distinctes B_1 != B_2 d'une matrice
  large 2x3, VMLS ?11.11).
