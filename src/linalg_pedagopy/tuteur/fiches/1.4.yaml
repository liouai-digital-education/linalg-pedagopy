id: '1.4'
page: 3
type: modelisation
reformulation: Un vecteur $c \in \mathbb{R}^7$ représente les recettes quotidiennes
  d'un magasin du lundi ($c_1$) au dimanche ($c_7$). Donner le vecteur $a \in \mathbb{R}^7$
  tel que $a^T c$ représente la recette totale du week-end (samedi $c_6$ et dimanche
  $c_7$).
donnees:
  n: 7
verification:
  type: produit_scalaire
  inconnue: c
  taille: 7
  cible: c[6] + c[7]
indices:
- Le vecteur $c$ possède 7 composantes (du jour 1 au jour 7). Quelle doit être la
  dimension de $a$ ?
- Un produit scalaire $a^T c$ sélectionne et additionne les composantes où $a_i$ vaut
  1.
- Quels indices correspondent au samedi et au dimanche dans un vecteur de taille 7
  ?
jumeau: generateurs.produit_scalaire_selection(n=5, indices=(1, 4))
notions:
- produit scalaire
- sélection et somme de composantes
- VMLS ch. 1
source: Boyd & Vandenberghe, Additional Exercises for VMLS, §1.4, p. 3
ecart: Modélisation vectorielle sur n=4 catégories illustrant VMLS §1.4.
