id: '1.2'
page: 3
type: modelisation
reformulation: Pour un vecteur $x \in \mathbb{R}^5$, déterminer le vecteur $a \in
  \mathbb{R}^5$ tel que le produit scalaire $a^T x$ soit égal à $x_2 - x_4$.
donnees:
  n: 5
verification:
  type: produit_scalaire
  inconnue: x
  taille: 5
  cible: x[2] - x[4]
indices:
- 'Identifiez la dimension de $x$ (ici $\mathbb{R}^5$) : le vecteur $a$ doit avoir
  la même dimension.'
- 'Rappel (VMLS ch. 1) : $a^T x = a_1 x_1 + a_2 x_2 + a_3 x_3 + a_4 x_4 + a_5 x_5$.'
- Quel coefficient $a_i$ faut-il placer devant $x_2$, devant $x_4$ et devant les autres
  composantes ?
jumeau: generateurs.produit_scalaire_selection(n=5, indices=(1, 4))
notions:
- produit scalaire
- VMLS ch. 1
source: Boyd & Vandenberghe, Additional Exercises for VMLS, §1.2, p. 3
ecart: Instance sur R^5 (cible x_2 - x_4) illustrant la modélisation par produit scalaire
  de VMLS §1.2.
