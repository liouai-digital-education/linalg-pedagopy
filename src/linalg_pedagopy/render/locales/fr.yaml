gj:
  domain: "Domaine de définition : les dénominateurs des coefficients imposent {domain} ; toute la suite se place sous cette condition."
  start: "Réduction de Gauss-Jordan d'une matrice {m}×{n}."
  column_step: "Traitement de la colonne {col} (ligne pivot courante : {row})."
  pivot_chosen: "Choix du pivot en ({row},{col}) de valeur {pivot} (stratégie : {strategy})."
  col_zero: "Aucun pivot non nul disponible dans la colonne {col} : variable x_{col} libre."
  row_swap: "On échange les lignes L{i} et L{j} : L{i} ↔ L{j}."
  row_scale: "On normalise le pivot de la ligne {i} : L{i} ← ({scale})·L{i}."
  row_add: "On annule le coefficient ({i},{col}) : L{i} ← L{i} {sign} {lam}·L{j}."
  case_split: "Discussion selon {param} pour le coefficient ({row},{col}) = {expr}."
  inconsistent: "Système incompatible : la ligne L{row} donne 0 = {rhs} (témoin : 0 = 1)."
  unique_solution: "Pivots non nuls, rang {rank}, solution unique : x = {x}."
  affine_solution: "Rang {rank} < {n} : ensemble affine de solutions avec {k} variable(s) libre(s)."
  singular_inverse: "La matrice est singulière (rang {rank} < {n}) : elle n'est pas inversible."
  inverse_found: "Matrice réduite à I_{n} à gauche : l'inverse A^(-1) est extraite à droite."
  summary: "Forme échelonnée réduite atteinte : rang = {rank}, colonnes pivots = {pivots}."
  verify: "Vérification a posteriori du résultat de Gauss-Jordan."
  verify_ok: "Contrôle vérifié : {detail}."

triangular:
  back_start: "Résolution par substitution arrière de R x = c (taille {n}×{n})."
  forward_start: "Résolution par substitution avant de L x = c (taille {n}×{n})."
  step: "Calcul de x_{i} : x_{i} = ({ci} - ({sum_terms})) / ({diag}) = {xi}."
  result: "Solution du système triangulaire : x = {x}."
  verify: "Vérification du système triangulaire : résidu nul confirmé par l'oracle."

gs:
  start: "Orthogonalisation de Gram-Schmidt de {k} vecteurs dans R^{m} (variante normalize='{mode}')."
  vector_step: "Étape i = {i} : traitement du vecteur a_{i}."
  proj_coeff: "Coefficient de projection sur q_{j} : r_({j},{i}) = (q_{j}^T a_{i}) / (q_{j}^T q_{j}) = {coeff}."
  proj_coeff_unit: "Coefficient de projection sur q_{j} : r_({j},{i}) = q_{j}^T a_{i} = {coeff}."
  subtract: "Soustraction des projections : q_tilde_{i} = {q_tilde}."
  dependent: "a_{i} est combinaison linéaire des vecteurs précédents : la famille est liée (témoin : {witness})."
  normalize_step: "Normalisation de q_tilde_{i} (norme {norm}) : q_{i} = {q}."
  radical_warning: "Remarque pédagogique : la normalisation immédiate introduit des radicaux dès l'étape {i}."
  end_normalize: "Normalisation finale des {k} vecteurs orthogonaux rationnels."
  summary_indep: "La famille est libre : {k} vecteurs orthonormés obtenus."
  verify: "Vérification de l'orthonormalité de la famille issue de Gram-Schmidt."

qr:
  start: "Factorisation QR de la matrice A de taille {m}×{n}."
  rational_step: "Construction de la factorisation rationnelle A = Q_tilde · R_tilde avec Q_tilde^T Q_tilde = D^2."
  normalize_step: "Passage à A = Q · R avec Q = Q_tilde · D^(-1) et R = D · R_tilde (diagonale de R strictement positive)."
  summary: "Factorisation A = Q R terminée."
  verify: "Vérification de la factorisation QR : contrôle de Q R = A et Q^T Q = I_{n} via l'oracle."
  verify_qr_eq_a: "Contrôle Q R - A = 0 : vérifié coefficient par coefficient."
  verify_qtq_eq_i: "Contrôle Q^T Q - I_{n} = 0 : vérifié coefficient par coefficient."

ls:
  start: "Résolution au sens des moindres carrés min ||A x - b|| (A de taille {m}×{n}, méthode '{method}')."
  rank_check: "Vérification du rang plein en colonnes : rang(A) = {rank} = {n}."
  rational_qr_step: "Équations réduites par QR rationnelle : R_tilde x_hat = D^(-2) Q_tilde^T b = {rhs}."
  qr_step: "Équations réduites par QR orthonormée : R x_hat = Q^T b = {rhs}."
  normal_step: "Formation des équations normales : (A^T A) x_hat = A^T b."
  pseudoinverse_note: "Note théorique : la pseudo-inverse est A† = (A^T A)^(-1) A^T, mais on résout par substitution sans inverser."
  analysis: "Analyse de la solution : x_hat = {x_hat}, projection y_hat = A x_hat = {y_hat}, résidu r_hat = A x_hat - b = {r_hat}."
  metrics: "Norme du résidu ||r_hat|| = {norm_r}, moyenne quadratique rms(r_hat) = {rms_r}."
  verify: "Vérification de la condition d'orthogonalité du résidu : A^T r_hat = 0 colonne par colonne."
  verify_col: "Colonne a_{j} : a_{j}^T r_hat = {val} (verdict : {verdict})."
