  matmul_entry: "Coefficient ({i},{j}) : ligne {i} de A · colonne {j} de B = {value}."
  matmul_row: "Ligne {i} du produit : combinaison des lignes de B avec les coefficients {coeffs} -> {row_result}."
  matmul_col: "Colonne {j} du produit : A · b_{j} avec les coefficients {coeffs} -> {col_result}."
  matmul_outer_term: "Terme extérieur k = {k} : colonne {k} de A × ligne {k} de B."
