  add_result: "Somme matricielle obtenue."
  sub: "Soustraction matricielle coefficient par coefficient."
  sub_result: "Différence matricielle obtenue."
  scale: "Multiplication de la matrice par le scalaire {scalar}."
  scale_result: "Matrice dilatée obtenue."
  matmul:
    entries: "Produit matriciel ({m}×{k}) @ ({k}×{p}) — vue par coefficients (produits scalaires ligne·colonne)."
