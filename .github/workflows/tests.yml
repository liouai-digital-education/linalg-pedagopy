# Intégration continue de linalg_pedagopy : tests, fiches du tuteur, ruff, mypy, carnets
# et fichiers générés de la documentation (site, catalogue des exercices, carnet du tutoriel).
name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:  # relance manuelle depuis l'onglet Actions

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plot,compare]"
      - name: Tests et couverture
        run: |
          python -m coverage run -m pytest
          python -m coverage report --sort=cover
      - name: Validation des fiches du tuteur
        run: python -c "import sys; sys.path.insert(0,'src'); from linalg_pedagopy import tuteur; ko=[i for i in tuteur.lister_exercices() if not tuteur.valider_fiche(i).valide]; print(ko); sys.exit(1 if ko else 0)"

  tuteur:
    name: Tuteur avec ipywidgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plot,compare,tuteur]"
      - name: Tests du tuteur (panneau ipywidgets)
        run: python -m pytest tests/test_tuteur.py

  qualite:
    name: Ruff, mypy et carnets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plot,compare,tuteur]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy (périmètre strict, bloquant)
        run: mypy --python-version 3.12
      - name: Mypy (paquet complet, informatif)
        continue-on-error: true
        run: mypy --python-version 3.12 src/linalg_pedagopy
      - name: Carnets
        run: python tests/run_notebooks.py --moteur jupyter

  documentation:
    name: Documentation à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      # Le catalogue d'abord : le site reprend docs/08_catalogue_exercices.md.
      - name: Régénération du catalogue des exercices
        run: python docs/generer_catalogue.py
      - name: Régénération du site
        run: python scripts/build_docs_site.py
      - name: Régénération du carnet du tutoriel
        run: python scripts/convert_tutorial_to_ipynb.py
      - name: Fichiers générés identiques aux fichiers versionnés
        run: |
          git diff --exit-code --stat -- docs/site docs/08_catalogue_exercices.md carnets/tutoriel_linalg_pedagopy.ipynb || {
            echo "::error::Fichiers générés périmés : lancez python docs/generer_catalogue.py, python scripts/build_docs_site.py et python scripts/convert_tutorial_to_ipynb.py, et commitez le résultat."
            git diff -- docs/site docs/08_catalogue_exercices.md carnets/tutoriel_linalg_pedagopy.ipynb | head -100
            exit 1
          }
          test -z "$(git status --porcelain --untracked-files=all -- docs/site)" || {
            echo "::error::Fichiers du site générés mais non versionnés :"
            git status --porcelain --untracked-files=all -- docs/site
            exit 1
          }
