# Intégration continue de linalg_pedagopy : tests, fiches du tuteur, ruff, mypy (informatif) et carnets.
name: Tests

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plot,compare]"
      - name: Tests et couverture
        run: |
          python -m coverage run -m pytest
          python -m coverage report --sort=cover
      - name: Validation des 35 fiches
        run: python -c "import sys; sys.path.insert(0,'src'); from linalg_pedagopy import tutor; ko=[i for i in tutor.list_exercises() if not tutor.validate_sheet(i).valid]; print(ko); sys.exit(1 if ko else 0)"

  qualite:
    name: Ruff, mypy et carnets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plot,compare,tuteur]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (informatif)
        continue-on-error: true
        run: mypy --python-version 3.12 src/linalg_pedagopy
      - name: Carnets
        run: python tests/run_notebooks.py --moteur jupyter
