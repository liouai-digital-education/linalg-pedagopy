[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linalg_pedagopy"
version = "3.0.1"
description = "Package pédagogique d'algèbre linéaire formelle : calcul exact, discussion de cas, explications pas à pas et tuteur interactif"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cédric Bohnert"}
]
keywords = ["linear-algebra", "sympy", "pedagogy", "formal-computation", "jupyter", "tutor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://liouai-digital-education.github.io/linalg-pedagopy/"
Documentation = "https://liouai-digital-education.github.io/linalg-pedagopy/"
Source = "https://github.com/liouai-digital-education/linalg-pedagopy"
Issues = "https://github.com/liouai-digital-education/linalg-pedagopy/issues"
Changelog = "https://github.com/liouai-digital-education/linalg-pedagopy/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tuteur = [
    "ipywidgets>=8.0",
    "jupyterlab>=4.0",
]
plot = [
    "matplotlib>=3.7",
]
compare = [
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.80",
    "mypy>=1.5",
    "ruff>=0.1",
    "coverage>=7.0",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linalg_pedagopy = [
    "render/locales/*.yaml",
    "tuteur/glossaire.yaml",
    "tuteur/fiches/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
# Périmètre bloquant de « mypy » sans argument (CI, verifier_tout.py) : sans erreur en mode strict.
# Le tuteur, les exercices et les comparaisons numériques restent à typer (phase 5 du plan v5) ;
# « mypy src/linalg_pedagopy » les vérifie à titre informatif.
files = [
    "src/linalg_pedagopy/core",
    "src/linalg_pedagopy/algorithms",
    "src/linalg_pedagopy/objects",
    "src/linalg_pedagopy/render",
    "src/linalg_pedagopy/trace",
    "src/linalg_pedagopy/plot",
    "src/linalg_pedagopy/config.py",
    "src/linalg_pedagopy/special.py",
]

[[tool.mypy.overrides]]
module = ["sympy.*", "yaml.*", "numpy.*", "matplotlib.*", "mpl_toolkits.*", "ipywidgets.*", "IPython.*", "nbclient.*", "nbformat.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]  # noms mathématiques courts (I, l) assumés

[tool.ruff.lint.per-file-ignores]
"src/linalg_pedagopy/__init__.py" = ["E402"]  # imports après les crochets d'initialisation

[tool.coverage.run]
source = ["linalg_pedagopy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
