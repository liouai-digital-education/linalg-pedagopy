[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linalg_pedagopy"
version = "3.0.0"
description = "Package pédagogique d'algèbre linéaire formelle : calcul exact, discussion de cas, explications pas à pas et tuteur interactif"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Cédric Bohnert"}
]
keywords = ["linear-algebra", "sympy", "pedagogy", "formal-computation", "jupyter", "tutor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tuteur = [
    "ipywidgets>=8.0",
    "jupyterlab>=4.0",
]
plot = [
    "matplotlib>=3.7",
]
compare = [
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.80",
    "syrupy>=4.0",
    "mypy>=1.5",
    "ruff>=0.1",
    "coverage>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linalg_pedagopy = [
    "render/locales/*.yaml",
    "tuteur/glossaire.yaml",
    "tuteur/fiches/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
